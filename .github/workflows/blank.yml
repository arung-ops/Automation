name: Playwright Test Execution

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        required: true
        default: "all"
        type: choice
        options:
          - smoke
          - regression
          - all

      browser:
        description: "Select browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

      workers:
        description: "Number of parallel workers"
        required: true
        default: "4"
        type: choice
        options:
          - "2"
          - "4"
          - "6"
          - "8"

jobs:

  playwright-tests:

    name: Playwright Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      CI: true

    steps:

      # --------------------------------
      # 1. Checkout Source Code
      # --------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------
      # 2. Setup Node.js
      # --------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # --------------------------------
      # 3. Install Dependencies
      # --------------------------------

      - name: Install Dependencies
        run: npm ci


      # --------------------------------
      # 4. Install Playwright Browser
      # --------------------------------

      - name: Install Playwright
        run: npx playwright install --with-deps ${{ inputs.browser }}


      # --------------------------------
      # 5. TypeScript Validation
      # --------------------------------

      - name: TypeScript Validation
        run: npx tsc --noEmit


      # --------------------------------
      # 6. Execute Tests in Parallel
      # --------------------------------

      - name: Run Playwright Tests
        run: |
          echo "======================================"
          echo "Test Suite : ${{ inputs.test_suite }}"
          echo "Browser    : ${{ inputs.browser }}"
          echo "Workers    : ${{ inputs.workers }}"
          echo "======================================"

          if [ "${{ inputs.test_suite }}" = "smoke" ]; then
            npx playwright test tests/smoke \
              --project=${{ inputs.browser }} \
              --workers=${{ inputs.workers }}

          elif [ "${{ inputs.test_suite }}" = "regression" ]; then
            npx playwright test tests/regression \
              --project=${{ inputs.browser }} \
              --workers=${{ inputs.workers }}

          else
            npx playwright test \
              --project=${{ inputs.browser }} \
              --workers=${{ inputs.workers }}
          fi


      # --------------------------------
      # 7. Upload Playwright HTML Report
      # --------------------------------

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30


      # --------------------------------
      # 8. Upload Screenshots
      # --------------------------------

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          retention-days: 30


      # --------------------------------
      # 9. Upload Allure Results
      # --------------------------------

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 30