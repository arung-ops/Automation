name: Playwright Manual Run

on:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Optional test pattern to run, e.g. e2e/example.spec.ts or login'
        required: false
        default: ''
      headed:
        description: 'Run tests in headed mode'
        type: boolean
        required: false
        default: false

jobs:
  manual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create output directories
        run: mkdir -p reports/playwright-report reports/allure-results test-results

      - name: Run selected Playwright tests
        run: |
          if [ -n "${{ github.event.inputs.test_pattern }}" ]; then
            npx playwright test ${{ github.event.inputs.test_pattern }} ${{ github.event.inputs.headed == 'true' && '--headed' || '' }}
          else
            if [ "${{ github.event.inputs.headed }}" = "true" ]; then
              npx playwright test --headed
            else
              npx playwright test
            fi
          fi
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-playwright-report
          path: reports/playwright-report/
          if-no-files-found: warn

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-playwright-results
          path: test-results/
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-allure-results
          path: reports/allure-results/
          if-no-files-found: warn
